      <div class="rec-head">${LINEAGE_MARK('rmi')}<div><b>LineageOS Recovery</b><small>${esc(ROMS.los.build())}</small></div></div>
      <div class="rec-menu"></div><div class="rec-log"></div>
      <div class="rec-keys">${REC_KEYS.map((k, i) => `<span><b>${k.replace(/_/g, ' ').toUpperCase()}</b>${['navigate', 'select', 'confirm'][i]}</span>`).join('')}</div>
    </div>`;
    const menu = $('.rec-menu', el), log = $('.rec-log', el);
    let stack = ['main'], sel = 0;
    const draw = () => {
      const items = REC_MENUS[stack[stack.length - 1]];
      menu.innerHTML = items.map((t, i) => `<button class="rc ${i === sel ? 'on' : ''}" data-i="${i}">${esc(t)}</button>`).join('');
      $('.rec-head b', el).textContent = stack.length > 1 ? ({ update: 'Apply update', wipe: 'Factory reset', advanced: 'Advanced options' })[stack[stack.length - 1]] : 'LineageOS Recovery';
    };
    const go = n => { stack.push(n); sel = 0; draw(); menu.animate([{ opacity: 0, transform: 'translateX(20px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.2,0,0,1)' }); };
    const home = () => { if (stack.length > 1) { stack = ['main']; sel = 0; draw(); return true; } return false; };
    const run = () => {
      const t = REC_MENUS[stack[stack.length - 1]][sel];
      if (t === 'Reboot system now') { romBoot('正在重启系统…', () => location.reload()); return; }
      if (t === 'Power off') { shutdown(); return; }
      if (t === 'Factory reset') return go('wipe');
      if (t === 'Apply update') return go('update');
      if (t === 'Advanced') return go('advanced');
      if (t === 'Wipe data/factory reset') return confirmDlg('抹除全部数据？', '将清空内部存储并重启系统。此操作无法撤销。', '抹除', () => { log.textContent = '-- Wiping userdata ...\nErasing /data ...\nFormat succeeded.'; setTimeout(() => { ST = {}; save(); try { localStorage.removeItem(LS_KEY); } catch (e) { } romBoot('正在重启系统…', () => location.reload()); }, 1200); }, true);
      if (t === 'Wipe cache partition') { log.textContent = '-- Wiping cache ...\nFormat succeeded.'; toast('缓存已清除'); return; }
      if (t === 'Wipe system partition') { log.textContent = '-- Erasing system ...\nThis is a read-only partition (erofs).'; toast('system 为只读分区（erofs）'); return; }
      if (t === 'Apply from ADB') { log.textContent = 'ADB sideload 等待中…\n没有检测到设备。'; toast('未检测到通过 ADB 连接的设备'); return; }
      if (t === 'Choose from internal storage') { log.textContent = '未找到 lineage-23.0-*.zip 更新包。'; toast('内部存储中没有更新包'); return; }
      if (t === 'Enter fastboot') { log.textContent = 'fastboot // bootloader unlocked: false\nRebooting to fastboot ...'; toast('（演示）无法进入 fastboot'); return; }
      if (t === 'Reboot to bootloader') { log.textContent = 'Rebooting to bootloader ...'; toast('（演示）引导程序已锁定，未切换'); return; }
      if (t === 'Reboot to recovery') { toast('已经在恢复模式中'); return; }
      if (t === 'Mount /system') { toast('已挂载 /system（只读）'); return; }
      if (t === 'View recovery logs') { log.textContent = LOGS_LOS.join('\n'); log.classList.add('on'); return; }
    };
    el.addEventListener('click', e => {
      if (e.target.closest('[data-i]')) { sel = +e.target.closest('[data-i]').dataset.i; draw(); run(); return; }
      if (e.target.closest('.rec-keys')) return;
    });
    el.addEventListener('keydown', e => {
      const k = e.key;
      if (k === 'ArrowDown') { sel = (sel + 1) % REC_MENUS[stack[stack.length - 1]].length; draw(); }
      else if (k === 'ArrowUp') { sel = (sel - 1 + REC_MENUS[stack[stack.length - 1]].length) % REC_MENUS[stack[stack.length - 1]].length; draw(); }
      else if (k === 'Enter') run();
      else if (k === 'Escape' || k === 'ArrowLeft') { if (!home()) goHome(); }
      else return;
      e.preventDefault(); e.stopPropagation();
    });
    el.tabIndex = 0;
    el._keys = true;
    draw();
  },
  show(el) { setTimeout(() => el.focus(), 60); },
  hide() { },
};
const LOGS_LOS = [
  '-- Booting Linux on physical CPU 0',
  '[    0.412000] init: Starting service zygote',
  '[    0.733000] init: Starting service surfaceflinger',
  '[    1.108000] lineage: mounting /system (erofs)',
  '[    1.462000] init: Starting service auditsd',
  '[    1.884000] boot_progress: start',
  '[    2.036000] AndroidLogo',
];

/* ---------- 终端 ---------- */
const FS = {
  '/': ['system/', 'data/', 'sdcard/', 'proc/', 'etc/', 'vendor/', 'storage/'],
  '/system': ['bin/', 'etc/', 'priv-app/', 'app/', 'build.prop', 'framework/'],
  '/system/bin': ['sh', 'ls', 'cat', 'pm', 'am', 'settings', 'getprop', 'dumpsys', 'reboot', 'su', 'wm', 'df', 'id', 'logcat'],
  '/etc': ['hosts', 'issue', 'os-release', 'group', 'passwd'],
  '/data': ['app/', 'media/', 'misc/', 'data/'],
  '/proc': ['cpuinfo', 'meminfo', 'version', 'uptime'],
};
const TERM_CMDS = {
  help() { return ['可用命令：', '  ls [路径]        列出目录', '  pwd              当前目录', '  cd <路径>        切换目录', '  cat <文件>       查看文件', '  getprop [键]     读取系统属性', '  setprop k v      写入属性（演示）', '  pm list packages 已安装的应用', '  am start <应用>  启动应用', '  settings get/put 设置项', '  dumpsys battery 电量信息', '  uptime           运行时间', '  wm size|density  屏幕信息', '  df               存储空间', '  su               获取 Root', '  lineage          LineageOS 信息', '  reboot           重启系统', '  clear            清屏', '  exit             回到桌面'].join('\n'); },
  ls(a) {
    const p = (TERM.cwd + (a[0] || '')).replace(/\/+/g, '/');
    const e = FS[p]; if (!e) return `ls: ${p}: No such file or directory`;
    return e.map(x => (x.endsWith('/') ? x + '/' : x)).join('   ');
  },
  pwd() { return TERM.cwd; },
  cd(a) { const p = (TERM.cwd + '/' + (a[0] || '..')).replace(/\/+/g, '/'); if (!FS[p]) return `cd: ${p}: No such file or directory`; TERM.cwd = p; return ''; },
  cat(a) {
    const p = (TERM.cwd + '/' + (a[0] || '')).replace(/\/+/g, '/');
    if (p === '/etc/os-release') return 'NAME="LineageOS"\nVERSION="23.0"\nID=lineageos\nID_LIKE=aosp\nPRETTY_NAME="LineageOS 23.0 (Primetime)"\nANDROID_API=36';
    if (p === '/proc/version') return 'Linux version 5.10.198-android12-9-g0000000000b (build@lineage) (Android (10087095, +pgo) clang version 17.0.2) #1 SMP PREEMPT';
    if (p === '/system/build.prop' || p === '/build.prop') return Object.entries(LOS_PROPS).map(([k, v]) => `${k}=${typeof v === 'function' ? v() : v}`).join('\n');
    if (p === '/proc/uptime') return (performance.now() / 1000 + 259200).toFixed(2) + ' ' + (performance.now() / 1000 * 1.35).toFixed(2);
    if (p === '/proc/cpuinfo') return Array.from({ length: (navigator.hardwareConcurrency || 8) }, (_, i) => `processor\t: ${i}\nmodel name\t: ${navigator.platform || 'ARMv8 Processor rev 1'}`).join('\n\n');
    if (p === '/proc/meminfo') return navigator.deviceMemory ? 'MemTotal:       ' + navigator.deviceMemory * 1024 * 1024 + ' kB' : 'MemTotal:       未知（浏览器未提供）';
    if (p === '/etc/issue') return 'LineageOS 23.0 \\n \\l';
    if (p === '/etc/hosts') return '127.0.0.1\tlocalhost\n::1\tlocalhost\n';
    return `cat: ${a[0] || ''}: No such file or directory`;
  },
  getprop(a) {
    if (!a.length) return Object.entries(LOS_PROPS).map(([k, v]) => `[${k}]: [${typeof v === 'function' ? v() : v}]`).join('\n');
    const k = a[0], all = Object.keys(LOS_PROPS).find(x => x.toLowerCase() === k.toLowerCase());
    return all ? `[${all}]: [${typeof LOS_PROPS[all] === 'function' ? LOS_PROPS[all]() : LOS_PROPS[all]}]` : '';
  },
  setprop(a) { if (a.length >= 2) { ST['prop_' + a[0]] = a.slice(1).join(' '); save(); return ''; } return 'usage: setprop <key> <value>'; },
  pm(a) {
    if (a[0] === 'list' && a[1] === 'packages') return APPS.map(x => 'package:' + (x.id === 'settings' ? 'com.android.settings' : 'org.lineageos.' + x.id)).join('\n');
    return 'usage: pm list packages';
  },
  am(a) {
    if (a[0] === 'start' && a[1]) {
      const x = APPS.find(v => v.id === a[1] || v.n === a[1] || (LOS_ALIAS[a[1]] === v.id));
      if (!x) return `Error: Activity not found: ${a[1]}`;
      setTimeout(() => openApp(x.id), 250);
      return `Starting: Intent { cmp=org.lineageos.${x.id}/.MainActivity }`;
    }
    return 'usage: am start <应用 id 或名称>';
  },
  settings(a) {
    if (a[0] === 'get') return a[1] ? String(get(a[1])) : '';
    if (a[0] === 'put' && a.length >= 3) { set(a[1], a[2], true); return ''; }
    return 'usage: settings get|put <key> [value]';
  },
  dumpsys(a) {
    if (a[0] === 'battery') return `Current Battery Service state:\n  AC powered: ${BAT.charging}\n  USB powered: false\n  status: ${battLevel()}%\n  health: 2\n  level: ${battLevel()}\n  scale: 100\n  voltage: ${3800 + battLevel() * 2}mV`;
    return 'usage: dumpsys battery';
  },
  uptime() { return ' up ' + upTime() + ',  load average: 0.' + (10 + Math.floor(Math.random() * 80)) + ', 0.' + (10 + Math.floor(Math.random() * 80)) + ', 0.' + (10 + Math.floor(Math.random() * 80)); },
  wm(a) { return a[0] === 'size' ? 'Physical size: ' + screen.width + 'x' + screen.height : a[0] === 'density' ? 'Physical density: ' + (devicePixelRatio * 160) : 'usage: wm size | wm density'; },
  df() { const t = storageTotals(); return 'Filesystem      Size  Used Avail Use%\n/dev/block/dm-5  128G  ' + (t.used / 1024).toFixed(1) + 'G  ' + ((t.total - t.used) / 1024).toFixed(1) + 'G   ' + Math.round(t.used / t.total * 100) + '%'; },
  free() { return '              total        used        free\nMem:      ' + (navigator.deviceMemory || 8) + 'G       ' + ((navigator.deviceMemory || 8) * .62).toFixed(1) + 'G       ' + ((navigator.deviceMemory || 8) * .38).toFixed(1) + 'G'; },
  id() { return get('losRoot') ? 'uid=2000(shell) gid=2000(shell) groups=2000(shell),4(ogroup),3009(readproc)  context=u:r:shell:s0' : 'uid=2000(shell) gid=2000(shell) groups=2000(shell),3009(readproc)  context=u:r:shell:s0'; },
  logcat() { return LOGS_LOS.join('\n') + '\n' + (get('losRoot') ? '[  12.331] su: root shell granted' : '--------- beginning of main'); },
  su(a) {
    if (a[0] === '-v') return get('losRoot') ? 'su: 1' : 'su: inaccessible or not found';
    if (!get('losRoot')) return 'su: inaccessible or not found\n（正式版不提供 Root，请在“Root 访问”中开启 userdebug 模拟）';
    setTimeout(() => { TERM.prompt = 'root@lineage:/ # '; TERM.draw && TERM.draw(); toast('已获取 Root（演示）'); }, 320);
    return '';
  },
  lineage() { return `LineageOS ${ROMS.los.ver} (Primetime)\nBuild: ${ROMS.los.build()}\nDevice: ${LOS_DEVICE}\nAndroid: 16  ·  Security: ${LOS_PATCH}\nKernel: ${LOS_KERNEL}`; },
  whoami() { return get('losRoot') ? 'root' : 'shell'; },
  date() { return new Date().toString(); },
  echo(a) { return a.join(' '); },
  reboot(a) {
    if (a[0] === 'recovery') { setTimeout(() => openApp('recovery'), 200); return 'Rebooting in recovery ...'; }
    romBoot('正在重启系统…', () => location.reload()); return 'Rebooting ...';
  },
  clear() { return '\f'; },
  exit() { setTimeout(goHome, 200); return ''; },
  help2() { return ''; },
};
const LOS_ALIAS = { camera: 'camera', gallery: 'gallery', browser: 'chrome', jelly: 'chrome', settings: 'settings', updater: 'updater', terminal: 'terminal', recovery: 'recovery', music: 'music', calendar: 'calendar', clock: 'clock', calc: 'calc', files: 'files', notes: 'notes', weather: 'weather', tasks: 'tasks' };
const LOS_PROPS = {
  'ro.lineage.version': '23.0',
  'ro.lineage.version.name': '23.0-20251011',
  'ro.lineage.build.version': () => ROMS.los.build(),
  'ro.product.model': LOS_DEVICE,
  'ro.product.name': 'lineage_tablet',
  'ro.product.device': 'tapaz',
  'ro.build.version.release': '16',
  'ro.build.version.sdk': '36',
  'ro.build.version.security_patch': '2025-08-05',
  'ro.build.type': () => (get('losRoot') ? 'userdebug' : 'user'),
  'ro.build.tags': 'release-keys',
  'ro.build.host': 'lineage-build',
  'ro.kernel.version': LOS_KERNEL,
  'ro.boot.verifiedbootstate': 'green',
  'ro.debuggable': () => (get('losRoot') ? '1' : '0'),
  'ro.trebuchet.icons.shape': () => get('iconShape'),
  'persist.sys.locale': () => get('lang'),
};
const TERM = { cwd: '/', hist: [], hi: 0, prompt: 'shell@lineage:/ $ ', draw: null };
APPDEF.terminal = {
  mount(el) {
    el.classList.add('opaquewin');
    const { body } = shell(el, '终端', `<button class="iconbtn" data-kb aria-label="键盘">${ic('keyboard')}</button>`);
    body.innerHTML = `<div class="term"><div class="tout"></div><div class="tin"><span class="tp"></span><input spellcheck="false" autocomplete="off" aria-label="终端输入"></div></div>`;
    const out = $('.tout', body), inp = $('input', body);
    const drawT = () => { $('.tp', body).textContent = TERM.prompt; }; TERM.draw = drawT;
    const put = (txt, cls) => { const d = document.createElement('div'); d.className = 'tl ' + (cls || ''); d.textContent = txt; out.append(d); out.scrollTop = out.scrollHeight; };
    const run = () => {
      const line = inp.value; inp.value = '';
      put(TERM.prompt + line, 'cmd');
      if (!line.trim()) return;
      TERM.hist.unshift(line); TERM.hi = -1;
      const [c, ...a] = line.trim().split(/\s+/);
      if (!TERM_CMDS[c]) return put(c + ': command not found', 'err');
      let r; try { r = TERM_CMDS[c](a); } catch (e) { r = c + ': ' + e.message; }
      if (r === '\f') out.innerHTML = ''; else if (r) String(r).split('\n').forEach(l => put(l));
    };
    body.addEventListener('click', e => { if (e.target.closest('[data-kb]')) { inp.focus(); return; } if (!e.target.closest('button')) inp.focus(); });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') run();
      else if (e.key === 'ArrowUp') { e.preventDefault(); if (TERM.hi < TERM.hist.length - 1) { TERM.hi++; inp.value = TERM.hist[TERM.hi]; } }
      else if (e.key === 'ArrowDown') { e.preventDefault(); if (TERM.hi > 0) { TERM.hi--; inp.value = TERM.hist[TERM.hi]; } else { TERM.hi = -1; inp.value = ''; } }
      else if (e.key === 'Tab') { e.preventDefault(); }
      else if (e.ctrlKey && e.key.toLowerCase() === 'l') { e.preventDefault(); out.innerHTML = ''; }
      else if (e.ctrlKey && e.key.toLowerCase() === 'c') { inp.value = ''; put(TERM.prompt + '^C', 'cmd'); }
      e.stopPropagation();
    });
    el._key = e => { if (UI.app !== 'terminal' || e.target === inp) return; if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) { inp.value += e.key; e.preventDefault(); } else if (e.key === 'Enter') { run(); e.preventDefault(); } else if (e.key === 'Backspace') { inp.value = inp.value.slice(0, -1); e.preventDefault(); } };
    addEventListener('keydown', el._key, true);
    put('LineageOS ' + ROMS.los.ver + ' (Primetime)  #' + (get('losRoot') ? 'userdebug' : 'user'), 'sys');
    put('输入 help 查看可用命令。');
    drawT();
  },
  show(el) { setTimeout(() => { const i = $('input', el); i && i.focus(); }, 80); },
  hide() { },
};
boot();
