<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eeedf4">
<link rel="icon" href="data:,">
<title>设置 · Material You · Pixel Tablet</title>
<style>
:root{
  --c-primary:#4a5fa8;--c-on-primary:#fff;--c-primary-container:#dbe1ff;--c-on-primary-container:#001849;
  --c-secondary:#585e71;--c-on-secondary:#fff;--c-secondary-container:#dce2f9;--c-on-secondary-container:#151b2c;
  --c-tertiary:#745470;--c-on-tertiary:#fff;--c-tertiary-container:#ffd6f8;--c-on-tertiary-container:#2c122a;
  --c-error:#ba1a1a;--c-on-error:#fff;--c-error-container:#ffdad6;--c-on-error-container:#410002;
  --c-surface:#faf8ff;--c-on-surface:#1a1b20;--c-surface-variant:#e2e2ec;--c-on-surface-variant:#44464f;
  --c-outline:#757780;--c-outline-variant:#c5c6d0;--c-surface-dim:#dad9e0;--c-surface-bright:#faf8ff;
  --c-surface-container-lowest:#fff;--c-surface-container-low:#f4f3fa;--c-surface-container:#eeedf4;
  --c-surface-container-high:#e8e7ef;--c-surface-container-highest:#e3e1e9;
  --c-inverse-surface:#2f3036;--c-inverse-on-surface:#f1f0f7;--c-inverse-primary:#b4c5ff;
  --c-bg:#eeedf4;--c-card:#faf8ff;
  --ease:cubic-bezier(.2,0,0,1);--spring:cubic-bezier(.34,1.56,.64,1);--anim:1;
  --fscale:1;--dzoom:1;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:"Google Sans Text","Google Sans","Product Sans","Roboto Flex",Roboto,"Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in oklab,var(--c-primary) 22%,#1c1d22) 0%,#0c0d10 75%);
  color:var(--c-on-surface);-webkit-font-smoothing:antialiased;user-select:none;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
.ic{width:24px;height:24px;fill:currentColor;flex:none;display:block}

/* ===== Pixel Tablet device ===== */
.device{
  position:absolute;left:50%;top:50%;transform-origin:center;
  background:#08090b;border-radius:46px;padding:18px;
  box-shadow:0 0 0 2px #1d1f23,0 0 0 5px #8a988e,0 0 0 7px #5d6a62,0 50px 120px rgba(0,0,0,.6),inset 0 0 0 1px #2b2e33;
  transition:border-radius .4s var(--ease),padding .4s var(--ease),box-shadow .4s var(--ease);
}
.device::before{ /* hazel rim highlight */
  content:"";position:absolute;inset:-7px;border-radius:53px;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.28),transparent 30%,transparent 70%,rgba(255,255,255,.12));
  -webkit-mask:linear-gradient(#000 0 0) exclude,linear-gradient(#000 0 0) content-box;padding:7px;
  mask:linear-gradient(#000 0 0) exclude,linear-gradient(#000 0 0) content-box;
}
.cam{position:absolute;top:6px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#3a4a66,#0b0d12 60%);box-shadow:0 0 0 1.5px #16181d}
.device.nf{border-radius:0;padding:0;box-shadow:none}
.device.nf::before,.device.nf .cam{display:none}
.screen{
  position:relative;width:100%;height:100%;overflow:hidden;overflow:clip;border-radius:28px;
  background:var(--c-bg);color:var(--c-on-surface);
  font-size:calc(16px*var(--fscale));isolation:isolate;
  transition:border-radius .4s var(--ease);
}
.device.nf .screen{border-radius:0}
.fx-invert .screen{filter:invert(1) hue-rotate(180deg)}
.fx-gray .screen{filter:grayscale(1)}
.fx-invert.fx-gray .screen{filter:invert(1) hue-rotate(180deg) grayscale(1)}
.bold-text .screen{font-weight:500}
.bold-text .screen b{font-weight:700}
.hc-text .screen small{color:var(--c-on-surface)}
.layout-bounds .screen *{outline:1px solid rgba(255,0,100,.35)}

/* ===== status bar & taskbar ===== */
.sb{position:absolute;left:0;right:0;top:0;height:38px;z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:.8125em;font-weight:600;cursor:default;transition:color .4s;color:var(--c-on-surface)}
.sb .l,.sb .r{display:flex;align-items:center;gap:10px}
.sb .ic{width:18px;height:18px}
.sb .dt{opacity:.75;font-weight:500}
.onwall .sb{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.bat{display:flex;align-items:center;gap:5px}
.bat i{position:relative;width:22px;height:11px;border-radius:3.5px;border:1.5px solid currentColor;display:block;opacity:.95}
.bat i::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;border-radius:0 2px 2px 0;background:currentColor}
.bat i b{position:absolute;left:1px;top:1px;bottom:1px;border-radius:1.5px;background:currentColor;width:calc(var(--lv,80)*1%*.88);transition:width .4s}
.bat.saver{color:#e6a700}
.appi{--bg:var(--c-primary-container);--fg:var(--c-on-primary-container);background:var(--bg);color:var(--fg);border-radius:var(--ishape,50%);transition:background .4s,color .4s,border-radius .35s}
.no-themed .appi{background:var(--cc);color:#fff}
.appi .ic{width:26px;height:26px}

/* ===== PixelUI layers ===== */
.screen{--hs:1}
/* app windows */
.win{position:absolute;inset:0;padding-top:38px;z-index:12;background:var(--c-bg);display:none;overflow:clip;border-radius:0;color:var(--c-on-surface)}
.win.open{display:block}
.win.anim{border-radius:28px}
.splash{position:absolute;inset:0;display:grid;place-items:center;background:var(--c-bg);z-index:9;pointer-events:none}
.splash .appi{width:104px;height:104px;display:grid;place-items:center}
.splash .appi .ic{width:52px;height:52px}
#wins{position:absolute;inset:0;z-index:12;pointer-events:none}
#wins .win{pointer-events:auto}
.wbar{display:flex;align-items:center;gap:8px;height:76px;padding:12px 28px 0;font-size:1.75em;font-weight:400}
.wbar .iconbtn{margin-left:-10px;color:var(--c-on-surface)}
.wbody{position:absolute;left:0;right:0;top:114px;bottom:0;padding-bottom:26px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--c-outline-variant) transparent}

/* home */
.home{position:absolute;inset:0;z-index:1;background-size:cover;background-position:center;overflow:hidden;transition:opacity .3s var(--ease),transform .5s var(--ease)}
.home::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.22),transparent 26%,transparent 60%,rgba(0,0,0,.32));pointer-events:none;transition:background .5s}
.dark-wp .home::before{background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.28) 40%,rgba(0,0,0,.5))}
.home.under{opacity:0;visibility:hidden;transform:scale(.94);transition:opacity .25s,transform .4s var(--ease),visibility 0s .3s}
.ws{position:absolute;left:44px;right:44px;top:48px;bottom:216px;touch-action:none;clip-path:inset(0 -44px)}
.nosearch .ws{bottom:150px}
.track{position:absolute;inset:0;will-change:transform}
.pg{position:absolute;top:0;height:100%;width:100%}
.hi{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7),0 0 14px rgba(0,0,0,.45);font-size:.8125em;font-weight:500;cursor:pointer;touch-action:none}
.hi .appi{width:calc(62px*var(--his,1));height:calc(62px*var(--his,1));display:grid;place-items:center;position:relative;transition:transform .35s var(--spring),background .4s,color .4s,border-radius .35s}
.hi .appi .ic{width:calc(30px*var(--his,1));height:calc(30px*var(--his,1))}
.hi:active .appi{transform:scale(.88)}
.hi .lb{max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nolabels .hi .lb{display:none}
.dot{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--c-error);color:var(--c-on-error);font-size:.6875rem;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px rgba(0,0,0,.18);text-shadow:none;animation:pop .5s var(--spring)}
@keyframes pop{from{transform:scale(0)}}
.nodots .dot{display:none}
.hw{position:absolute;touch-action:none}
.hw.ghostsrc,.hi.ghostsrc{opacity:.0}
.wg{container-type:size;width:100%;height:100%;border-radius:28px;overflow:hidden;position:relative;color:var(--c-on-surface)}
.wg .in{position:absolute;inset:0}
.added{animation:addin .7s var(--spring)}
@keyframes addin{from{transform:scale(.4);opacity:0}}
.pdots{position:absolute;left:0;right:0;bottom:192px;height:14px;display:flex;justify-content:center;align-items:center;gap:8px;z-index:3;pointer-events:none}
.nosearch .pdots{bottom:128px}
.pdots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.55);transition:width .5s var(--spring),background .3s}
.pdots i.on{width:26px;background:#fff}
.hsearch{position:absolute;left:24px;right:24px;bottom:120px;height:62px;z-index:4;border-radius:31px;
  background:color-mix(in oklab,var(--c-surface-container-high) 92%,transparent);backdrop-filter:blur(16px);box-shadow:0 4px 18px rgba(0,0,0,.25);
  display:flex;align-items:center;gap:14px;padding:0 20px 0 18px;color:var(--c-on-surface-variant);cursor:text;transition:transform .4s var(--spring),opacity .3s,background .4s;touch-action:none}
.hsearch:hover{background:var(--c-surface-container-highest)}
.hsearch .g{width:26px;height:26px;flex:none}
.hsearch .ph{flex:1;font-size:1.0625em}
.hsearch .ic{width:24px;height:24px}
.hsearch .ic.mic{color:var(--c-primary)}
.nosearch .hsearch{display:none}
.dropzone{position:absolute;top:50px;left:50%;transform:translate(-50%,-30px);display:flex;gap:14px;opacity:0;pointer-events:none;z-index:51;transition:opacity .25s,transform .4s var(--spring)}
.dropzone.on{opacity:1;transform:translate(-50%,0)}
.dz{height:54px;padding:0 26px;border-radius:27px;background:var(--c-surface-container-high);color:var(--c-on-surface);display:flex;align-items:center;gap:10px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.3);transition:background .2s,transform .3s var(--spring),color .2s}
.dz.hot{background:var(--c-error);color:var(--c-on-error);transform:scale(1.1)}
.dz.hot.info{background:var(--c-primary);color:var(--c-on-primary)}
.drop{position:absolute;border-radius:26px;border:3px dashed color-mix(in oklab,#fff 80%,transparent);background:rgba(255,255,255,.14);pointer-events:none;transition:left .22s var(--spring),top .22s var(--spring),width .2s,height .2s,opacity .2s}
.drop.bad{border-color:var(--c-error);background:rgba(255,80,80,.18)}
.ghost{position:absolute;z-index:53;pointer-events:none;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45));transform-origin:center}
.ghost>*{transform:scale(1.07)}
#layer{position:absolute;inset:0;z-index:50;pointer-events:none}
#layer>*{pointer-events:auto}
#layer>.ghost{pointer-events:none}

/* popup menu */
.menu{position:absolute;z-index:52;min-width:250px;padding:8px;border-radius:26px;background:var(--c-surface-container-high);color:var(--c-on-surface);
  box-shadow:0 10px 36px rgba(0,0,0,.4);transform-origin:var(--ox,0) var(--oy,0);animation:menu .45s var(--spring)}
@keyframes menu{from{opacity:0;transform:scale(.6)}}
.menu.out{opacity:0;transform:scale(.9);transition:.15s}
.menu button{display:flex;align-items:center;gap:16px;height:54px;padding:0 20px;width:100%;border-radius:20px;position:relative;overflow:hidden;font-weight:500}
.menu button:hover{background:color-mix(in oklab,var(--c-on-surface) 8%,transparent)}
.menu button .ic{color:var(--c-primary)}
.menu hr{border:0;height:1px;background:var(--c-outline-variant);margin:4px 14px;opacity:.6}

/* app drawer */
.drawer{position:absolute;left:0;right:0;top:0;height:calc(100% + 80px);z-index:20;padding:52px 72px 190px;
  background:color-mix(in oklab,var(--c-surface-container) 91%,transparent);backdrop-filter:blur(36px);border-radius:36px 36px 0 0;
  transform:translateY(105%);visibility:hidden;display:flex;flex-direction:column;gap:14px;color:var(--c-on-surface);will-change:transform;box-shadow:0 -10px 50px rgba(0,0,0,.25)}
.drawer.vis{visibility:visible}
.dhandle{position:absolute;left:50%;top:12px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--c-outline);opacity:.6}
.dsearch{height:60px;border-radius:30px;background:var(--c-surface-container-highest);display:flex;align-items:center;gap:14px;padding:0 22px;flex:none;max-width:760px;width:100%;margin:6px auto 0;transition:box-shadow .3s}
.dsearch:focus-within{box-shadow:0 0 0 2px var(--c-primary)}
.dsearch .ic{color:var(--c-on-surface-variant)}
.dsearch input{flex:1;border:0;background:none;outline:0;font-size:1.0625em;color:var(--c-on-surface);user-select:text}
.dsearch input::placeholder{color:var(--c-on-surface-variant)}
.dsug{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px 0 2px}
.dsug[hidden]{display:none}
.dsug .tt,.dgrid .tt{font-size:.875em;font-weight:600;color:var(--c-primary);padding:0 10px}
.dsug .row2{display:flex;justify-content:center;gap:6px}
.dgrid{flex:1;overflow-y:auto;overflow-x:hidden;display:grid;grid-template-columns:repeat(var(--dcols,auto-fill),minmax(124px,1fr));align-content:start;gap:4px 6px;scrollbar-width:thin;scrollbar-color:var(--c-outline-variant) transparent;padding:6px 0 20px;min-height:0}
.dgrid .tt{grid-column:1/-1;padding:12px 10px 4px}
.da{display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 6px 10px;border-radius:26px;cursor:pointer;position:relative;overflow:hidden;font-size:.8125em;width:124px;justify-self:center;touch-action:pan-y}
.da:hover{background:color-mix(in oklab,var(--c-on-surface) 7%,transparent)}
.da .appi{width:64px;height:64px;display:grid;place-items:center;position:relative;transition:transform .35s var(--spring),background .4s,color .4s,border-radius .35s}
.da .appi .ic{width:30px;height:30px}
.da:active .appi{transform:scale(.88)}
.da .lb{max-width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.da mark{background:color-mix(in oklab,var(--c-primary) 30%,transparent);color:inherit;border-radius:3px}
.dres{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:12px 18px;border-radius:22px;cursor:pointer;position:relative;overflow:hidden;width:100%;max-width:760px;justify-self:center}
.dres:hover{background:color-mix(in oklab,var(--c-on-surface) 7%,transparent)}
.dres .ri{width:44px;height:44px;border-radius:50%;background:var(--c-secondary-container);color:var(--c-on-secondary-container);display:grid;place-items:center;flex:none}
.dres b{font-weight:500;display:block}
.dres small{color:var(--c-on-surface-variant)}

/* widget picker */
.picker{position:absolute;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);animation:sc .25s var(--ease)}
.picker.out{opacity:0;transition:opacity .2s}
.pk{width:min(1240px,calc(100% - 56px));height:min(780px,calc(100% - 72px));display:grid;grid-template-columns:330px 1fr;border-radius:40px;background:var(--c-surface-container-low);color:var(--c-on-surface);overflow:clip;box-shadow:0 24px 70px rgba(0,0,0,.5);animation:dlg .5s var(--spring)}
.pk-l{display:flex;flex-direction:column;min-height:0;background:var(--c-surface-container);padding-top:22px}
.pk-l h2{margin:0 0 14px 28px;font-size:1.625em;font-weight:400}
.pk-s{margin:0 16px 10px;height:52px;border-radius:26px;background:var(--c-surface-container-highest);display:flex;align-items:center;gap:10px;padding:0 18px}
.pk-s input{flex:1;border:0;background:none;outline:0;font-size:1em;color:var(--c-on-surface);user-select:text;min-width:0}
.pk-s .ic{color:var(--c-on-surface-variant)}
.pk-list{position:relative;flex:1;overflow-y:auto;padding:0 0 16px;scrollbar-width:thin}
.pki{position:relative;z-index:1;display:flex;align-items:center;gap:14px;height:56px;margin:0 12px 2px;padding:0 16px;width:calc(100% - 24px);border-radius:28px;overflow:hidden;transition:color .3s}
.pki::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .2s}
.pki:hover::before{opacity:.07}
.pki .ai{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--bg,var(--c-primary-container));color:var(--fg,var(--c-on-primary-container));flex:none}
.pki .ai .ic{width:20px;height:20px}
.pki b{font-weight:500;flex:1;text-align:left}
.pki small{color:var(--c-on-surface-variant);transition:color .3s}
.pki.on,.pki.on small{color:var(--c-on-secondary-container)}
.pk-list .jelly{background:var(--c-secondary-container)}
.pk-r{display:flex;flex-direction:column;min-height:0;position:relative}
.pk-h{display:flex;align-items:center;gap:12px;padding:26px 34px 6px;flex:none}
.pk-h b{font-size:1.375em;font-weight:500;flex:1}
.pk-grid{flex:1;overflow-y:auto;padding:14px 30px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:26px 24px;align-content:start;scrollbar-width:thin}
.pkc{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 18px 16px;border-radius:30px;background:var(--c-surface-container-high);cursor:pointer;position:relative;transition:background .3s,box-shadow .3s,transform .35s var(--spring)}
.pkc:hover{transform:translateY(-3px)}
.pkc.sel{background:var(--c-primary-container);box-shadow:0 0 0 3px var(--c-primary)}
.pkc .pvw{width:100%;display:grid;place-items:center;pointer-events:none}
.pkc .pvw .wgp{background:var(--c-surface-container-lowest);border-radius:28px}
.pkc .pvw .wg{box-shadow:0 2px 12px rgba(0,0,0,.18)}
.pkc .nm{font-weight:500;text-align:center}
.pkc .nm small{display:block;color:var(--c-on-surface-variant);font-weight:400}
.pkc.sel .nm small{color:var(--c-on-primary-container)}
.pkc .add{height:42px;padding:0 22px;border-radius:21px;background:var(--c-primary);color:var(--c-on-primary);font-weight:500;display:none;align-items:center;gap:8px;position:relative;overflow:hidden}
.pkc.sel .add{display:flex;animation:pop .45s var(--spring)}
.pk-empty{grid-column:1/-1;padding:60px 0;text-align:center;color:var(--c-on-surface-variant)}

/* shade (notifications + quick settings) */
.sscrim{position:absolute;inset:0;z-index:39;background:rgba(0,0,0,.4);opacity:0;pointer-events:none}
.shade{position:absolute;left:0;right:0;top:0;z-index:40;padding:56px 36px 28px;display:grid;grid-template-columns:1fr 1fr;gap:28px;visibility:hidden;
  background:color-mix(in oklab,var(--c-surface-container-low) 95%,transparent);backdrop-filter:blur(36px);border-radius:0 0 40px 40px;transform:translateY(-110%);
  color:var(--c-on-surface);will-change:transform;box-shadow:0 12px 50px rgba(0,0,0,.35);max-height:100%}
.shade.vis{visibility:visible}
.sh-n{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 6px}
.sh-head .tm{font-size:2.6em;font-weight:400;letter-spacing:-.02em;line-height:1}
.sh-head .dd{color:var(--c-on-surface-variant);margin-top:4px}
.nlist{display:flex;flex-direction:column;gap:6px;overflow-y:auto;max-height:420px;padding-right:2px;scrollbar-width:thin}
.nc{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;background:var(--c-surface-container-high);position:relative;overflow:hidden;cursor:pointer;transition:transform .45s var(--spring),opacity .3s,max-height .4s;max-height:110px}
.nc:first-child{border-top-left-radius:28px;border-top-right-radius:28px}
.nc:last-child{border-bottom-left-radius:28px;border-bottom-right-radius:28px}
.nc:only-child{border-radius:28px}
.nc .ai{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--bg);color:var(--fg)}
.nc .ai .ic{width:22px;height:22px}
.nc .tx{flex:1;min-width:0}
.nc .tx b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc .tx small{color:var(--c-on-surface-variant);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc .tm2{color:var(--c-on-surface-variant);font-size:.75em;align-self:flex-start}
.nc.gone{transform:translateX(110%);opacity:0;max-height:0;padding-top:0;padding-bottom:0;margin-bottom:-6px}
.nempty{padding:50px 0;text-align:center;color:var(--c-on-surface-variant)}
.sh-btns{display:flex;gap:10px;padding:6px 4px 0}
.sh-q{display:flex;flex-direction:column;gap:14px;min-width:0}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qt{height:78px;border-radius:39px;background:var(--c-surface-container-highest);display:flex;align-items:center;gap:14px;padding:0 20px 0 18px;text-align:left;position:relative;overflow:hidden;
  transition:background .3s,color .3s,border-radius .5s var(--spring),transform .3s var(--spring)}
.qt:active{transform:scale(.95)}
.qt .ic{width:26px;height:26px}
.qt .tx{min-width:0}
.qt .tx b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qt .tx small{display:block;font-size:.8125em;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qt.on{background:var(--c-primary);color:var(--c-on-primary);border-radius:26px}
.qbright{padding:4px 0}
.qmedia{border-radius:32px;background:var(--c-secondary-container);color:var(--c-on-secondary-container);padding:16px 18px;display:flex;gap:16px;align-items:center}
.qmedia .art{width:72px;height:72px;border-radius:20px;flex:none;display:grid;place-items:center;color:#fff}
.qmedia .tx{flex:1;min-width:0}
.qmedia .tx b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qmedia .tx small{display:block;opacity:.75}
.qmedia .ct{display:flex;gap:2px}
.qmedia .ct button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;overflow:hidden}
.qmedia .ct button.pp{background:var(--c-primary);color:var(--c-on-primary)}
.qmedia .bar2{height:6px;border-radius:3px;background:color-mix(in oklab,var(--c-on-secondary-container) 20%,transparent);margin-top:10px;overflow:hidden}
.qmedia .bar2 i{display:block;height:100%;background:var(--c-primary);border-radius:3px;transition:width 1s linear}
.shgrip{position:absolute;left:50%;bottom:10px;width:56px;height:5px;margin-left:-28px;border-radius:3px;background:var(--c-outline);opacity:.6}
.sb{cursor:default}
.sb .l,.sb .r{padding:4px 8px;border-radius:14px}
.sb .r:hover,.sb .l:hover{background:rgba(127,127,127,.18)}

/* taskbar */
.dock .dk.ghostbtn{background:none;color:var(--c-on-surface)}
.dock .sep{width:1px;margin:8px 4px;background:var(--c-outline-variant);opacity:.7}
.dk.dkmain{--bg:var(--c-secondary-container);--fg:var(--c-on-secondary-container)}
.dk .dkdot{position:absolute;left:50%;bottom:-6px;width:6px;height:6px;margin-left:-3px;border-radius:3px;background:var(--c-primary);opacity:0;transition:opacity .2s,width .4s var(--spring),margin .4s var(--spring)}
.dk.act .dkdot,.dk.run .dkdot{opacity:1}
.dk.act .dkdot{width:18px;margin-left:-9px}
.dk.act::after{display:none}

/* compact tweaks for the launcher */
.compact .ws{left:16px;right:16px}
.compact .drawer{padding:48px 18px 170px}
.compact .shade{grid-template-columns:1fr;padding:56px 16px 24px;overflow-y:auto}
.compact .pk{grid-template-columns:1fr;grid-template-rows:auto 1fr}
.compact .pk-l{max-height:230px}

.tray{position:absolute;left:50%;width:min(1100px,calc(100% - 48px));margin-left:calc(min(1100px,calc(100% - 48px))/-2);bottom:26px;height:88px;z-index:4;touch-action:none}
.tray .hi{gap:0}
.tray .hi .lb{display:none}
.tray .hi .appi{width:64px;height:64px}
.nosearch .tray{bottom:34px}
.navpill{position:absolute;left:50%;bottom:0;width:180px;height:26px;margin-left:-90px;z-index:45;display:grid;place-items:end center;padding-bottom:8px;cursor:pointer;touch-action:none;transition:transform .3s var(--spring)}
.navpill i{display:block;width:132px;height:5px;border-radius:3px;background:var(--c-on-surface);opacity:.55;transition:width .3s var(--spring),opacity .2s,background .3s}
.onwall .navpill i{background:#fff;opacity:.85}
.navpill:hover i{width:156px;opacity:.9}
.navpill.dn i{width:104px}

@container (max-width:460px){.bub .t1 small{display:none}}

/* ===== settings layout ===== */
.ui{position:absolute;inset:38px 0 0 0;display:grid;grid-template-columns:minmax(340px,31%) 1fr;zoom:var(--dzoom)}
.left{display:flex;flex-direction:column;min-height:0;padding-top:4px}
.searchbar{margin:8px 12px 10px;height:56px;border-radius:28px;background:var(--c-surface-container-high);display:flex;align-items:center;gap:12px;padding:0 8px 0 20px;
  transition:background .3s,box-shadow .3s;flex:none}
.searchbar:focus-within{background:var(--c-surface-container-highest);box-shadow:0 0 0 2px var(--c-primary)}
.searchbar input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:1em;color:var(--c-on-surface);user-select:text}
.searchbar input::placeholder{color:var(--c-on-surface-variant)}
.searchbar .ic{color:var(--c-on-surface-variant)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--c-tertiary-container);color:var(--c-on-tertiary-container);display:grid;place-items:center;font-weight:700;flex:none;transition:background .4s,transform .3s var(--spring)}
.avatar:hover{transform:scale(1.08)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;overflow:hidden;color:var(--c-on-surface-variant);flex:none}
.iconbtn:hover{background:color-mix(in oklab,var(--c-on-surface) 8%,transparent)}
.nav{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 16px;scrollbar-width:thin;scrollbar-color:var(--c-outline-variant) transparent}
.ni{position:relative;z-index:1;display:flex;align-items:center;gap:16px;height:64px;margin:0 12px 2px;padding:0 22px;width:calc(100% - 24px);border-radius:32px;overflow:hidden;
  color:var(--c-on-surface);transition:color .3s}
.ni .ic{color:var(--c-on-surface-variant);transition:color .3s}
.ni::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .2s}
.ni:hover::before{opacity:.07}
.ni.on,.ni.on .ic{color:var(--c-on-secondary-container)}
.ni .nt{min-width:0;display:flex;flex-direction:column;gap:1px}
.ni b{font-weight:500;font-size:1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni small{font-size:.8125em;color:var(--c-on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.ni.on small{color:color-mix(in oklab,var(--c-on-secondary-container) 75%,transparent)}
.jelly{position:absolute;left:0;top:0;pointer-events:none;z-index:0;border-radius:999px;will-change:transform,width,height;opacity:0}
.jelly.on{opacity:1}
.nav .jelly{background:var(--c-secondary-container)}
.jelly.fill{background:var(--c-primary)}
.jelly.ring{z-index:3;border:3px solid var(--c-primary);border-radius:34px;background:transparent}
.jelly.ring.round{border-radius:50%}
.results{flex:1;overflow-y:auto;padding:0 12px 16px}
.results[hidden]{display:none}
.res{display:flex;align-items:center;gap:16px;padding:10px 14px;border-radius:22px;width:100%;position:relative;overflow:hidden}
.res:hover{background:color-mix(in oklab,var(--c-on-surface) 7%,transparent)}
.res .ri{width:40px;height:40px;border-radius:50%;background:var(--c-secondary-container);color:var(--c-on-secondary-container);display:grid;place-items:center;flex:none}
.res b{font-weight:500;display:block}
.res small{color:var(--c-on-surface-variant);font-size:.8125em}
.res mark{background:color-mix(in oklab,var(--c-primary) 28%,transparent);color:inherit;border-radius:4px;padding:0 1px}
.noresult{padding:48px 24px;text-align:center;color:var(--c-on-surface-variant)}
.noresult .ic{width:48px;height:48px;margin:0 auto 12px;opacity:.6}

.right{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.rhead{display:flex;align-items:center;gap:8px;height:84px;padding:12px 40px 0;flex:none;max-width:960px;width:100%;margin:0 auto}
.rhead h1{margin:0;font-size:2em;font-weight:400;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead .iconbtn{margin-left:-12px;display:none;color:var(--c-on-surface)}
.rhead .iconbtn.show{display:grid}
.rscroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--c-outline-variant) transparent;position:relative}
.page{max-width:960px;margin:0 auto;padding:6px 40px 40px}
.grp{margin-bottom:20px}
.grp[hidden]{display:none}
.gt{margin:0;padding:8px 18px 10px;font-size:.875em;font-weight:600;color:var(--c-primary);letter-spacing:.01em;transition:color .4s}
.gl{display:flex;flex-direction:column;gap:2px}
.row{position:relative;display:flex;align-items:center;gap:16px;min-height:64px;padding:12px 20px;background:var(--c-card);
  border-radius:6px;overflow:hidden;cursor:pointer;outline:0;transition:background .3s,border-radius .3s var(--ease),opacity .2s;touch-action:manipulation}
.row[hidden]{display:none}
.row.first{border-top-left-radius:28px;border-top-right-radius:28px}
.row.last{border-bottom-left-radius:28px;border-bottom-right-radius:28px}
.row:active{border-radius:20px}
.row::before{content:"";position:absolute;inset:0;background:var(--c-on-surface);opacity:0;transition:opacity .2s;pointer-events:none}
.row:hover::before{opacity:.05}
.row:focus-visible{box-shadow:inset 0 0 0 3px var(--c-primary)}
.row.dis{opacity:.4;pointer-events:none}
.row.flash{animation:flash 1.6s var(--ease)}
@keyframes flash{0%,60%{background:var(--c-primary-container)}100%{background:var(--c-card)}}
.row.info{cursor:default}
.row .ri{width:40px;height:40px;border-radius:50%;background:var(--c-secondary-container);color:var(--c-on-secondary-container);display:grid;place-items:center;flex:none;transition:background .4s,color .4s}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .rt b,.row .rtl b{font-weight:500;font-size:1em;line-height:1.3}
.row small{color:var(--c-on-surface-variant);font-size:.875em;line-height:1.35;transition:color .3s}
.row small:empty{display:none}
.row .chev{color:var(--c-on-surface-variant);opacity:.7}
.row .rval{color:var(--c-on-surface-variant);font-size:.875em}
.row.danger b{color:var(--c-error)}
.row .rb{flex:1;min-width:0}
.row .rtl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.row .sv{font-size:.875em;color:var(--c-on-surface-variant);font-variant-numeric:tabular-nums}
.row.slider{cursor:default;padding-top:14px;padding-bottom:16px}

/* switch */
.sw{width:52px;height:32px;border-radius:16px;background:var(--c-surface-container-highest);border:2px solid var(--c-outline);position:relative;flex:none;transition:background .25s,border-color .25s}
.sw-thumb{position:absolute;top:50%;left:6px;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--c-outline);display:grid;place-items:center;
  transition:left .5s var(--spring),width .3s var(--spring),height .3s var(--spring),margin .3s var(--spring),background .25s}
.sw-thumb .ic{width:16px;height:16px;opacity:0;transform:scale(.3) rotate(-60deg);transition:opacity .2s,transform .4s var(--spring);fill:var(--c-on-primary-container)}
.sw.on{background:var(--c-primary);border-color:var(--c-primary)}
.sw.on .sw-thumb{left:22px;width:24px;height:24px;margin-top:-12px;background:var(--c-on-primary)}
.sw.on .sw-thumb .ic{opacity:1;transform:none;color:var(--c-primary)}
.row:active .sw-thumb{width:28px;height:28px;margin-top:-14px}
.row:active .sw.on .sw-thumb{left:20px}
.row:active .sw:not(.on) .sw-thumb{left:4px}

/* slider */
.sl{position:relative;height:44px;touch-action:none;cursor:pointer;outline:0;--p:.5}
.sl .a,.sl .i,.sl .h{position:absolute;top:0;bottom:0}
.sl .a{left:0;width:calc((100% - 12px)*var(--p) + 6px - 6px);background:var(--c-primary);border-radius:22px 4px 4px 22px;transition:background .4s,width .08s linear}
.sl .i{left:calc((100% - 12px)*var(--p) + 6px + 6px);right:0;background:var(--c-secondary-container);border-radius:4px 22px 22px 4px;transition:background .4s,left .08s linear}
.sl .h{left:calc((100% - 12px)*var(--p) + 6px - 2px);width:4px;border-radius:2px;background:var(--c-primary);transition:background .4s,left .08s linear,width .2s var(--spring),transform .2s}
.sl.drag .h{width:2px;transform:scaleY(1.1)}
.sl.drag .a,.sl.drag .h,.sl.drag .i{transition:background .4s}
.sl:focus-visible .h{box-shadow:0 0 0 4px color-mix(in oklab,var(--c-primary) 30%,transparent)}

/* ripple */
.rip{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;transform:scale(0);opacity:.2;animation:rp .65s var(--ease) forwards}
.row .rp{background:var(--c-primary)}
@keyframes rp{60%{opacity:.16}100%{transform:scale(1);opacity:0}}

/* segmented (jelly) */
.seg{position:relative;display:inline-flex;padding:4px;border-radius:999px;background:var(--c-surface-container-highest);gap:0;max-width:100%}
.seg.full{display:flex}
.seg button{position:relative;z-index:1;flex:1;min-width:0;height:48px;padding:0 22px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;
  color:var(--c-on-surface-variant);transition:color .25s;white-space:nowrap}
.seg button .ic{width:20px;height:20px}
.seg button.on{color:var(--c-on-primary)}
.seg button:not(.on):hover{color:var(--c-on-surface)}
.seg.sm button{height:40px;padding:0 16px}
.seg.tonal .jelly{background:var(--c-secondary-container)}
.seg.tonal button.on{color:var(--c-on-secondary-container)}
.card{background:var(--c-card);border-radius:28px;padding:20px;transition:background .4s}
.card + .card{margin-top:12px}
.cardhead{padding:6px 4px 14px;font-size:.875em;font-weight:600;color:var(--c-primary)}

/* wallpaper studio */
.wp-top{display:grid;grid-template-columns:minmax(280px,1fr) 1fr;gap:24px;align-items:start}
.pv{container-type:inline-size;position:relative;aspect-ratio:16/10;border-radius:28px;background-size:cover;background-position:center;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.18);transition:background-image .4s}
.pv::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.12),transparent 40%,rgba(0,0,0,.25))}
.pv .pc{position:absolute;left:7cqw;top:8cqw;color:#fff;font-size:15cqw;line-height:1;font-weight:300;text-shadow:0 1px 10px rgba(0,0,0,.3);letter-spacing:-.03em}
.pv .pc.k-bold{font-weight:700}.pv .pc.k-thin{font-weight:200}
.pv .pc small{display:block;font-size:.2em;margin-top:.4em;letter-spacing:0;font-weight:500;color:#fff}
.pv .pw{position:absolute;right:6cqw;top:8cqw;width:36cqw;height:15cqw;border-radius:5cqw;background:var(--c-primary-container);color:var(--c-on-primary-container);
  display:flex;align-items:center;justify-content:center;font-size:5.4cqw;font-weight:600;gap:2cqw;transition:background .4s,color .4s}
.pv .pw .ic{width:7cqw;height:7cqw}
.pv .pw2{position:absolute;right:6cqw;top:26cqw;width:36cqw;height:14cqw;border-radius:5cqw;background:var(--c-tertiary-container);transition:background .4s}
.pv .pd{position:absolute;left:50%;bottom:4cqw;transform:translateX(-50%);display:flex;gap:2.4cqw;padding:2cqw 3cqw;border-radius:6cqw;background:color-mix(in oklab,var(--c-surface-container-high) 75%,transparent);backdrop-filter:blur(8px)}
.pv .pd .appi{width:8cqw;height:8cqw;display:grid;place-items:center}
.pv .pd .appi .ic{width:4.6cqw;height:4.6cqw}
.wp-grid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:6px}
.wpt{position:relative;z-index:1;aspect-ratio:1;border-radius:26px;background-size:cover;background-position:center;overflow:hidden;transition:transform .3s var(--spring)}
.wpt:hover{transform:scale(1.04)}
.wpt:active{transform:scale(.94)}
.wpt.add{background:var(--c-secondary-container);color:var(--c-on-secondary-container);display:grid;place-items:center}
.wpt.add .ic{width:30px;height:30px}
.wpt .nm{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 6px;font-size:.75em;color:#fff;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.5))}
.sw-grid{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:14px;padding:10px 6px 6px}
.sw-grid .pad{animation:fadein .4s var(--ease)}
.swt{position:relative;z-index:1;aspect-ratio:1;border-radius:28px;display:grid;place-items:center;transition:transform .3s var(--spring)}
.swt:hover{transform:scale(1.05)}
.swt:active{transform:scale(.93)}
.swt .pie{width:62%;aspect-ratio:1;border-radius:50%;position:relative}
.swt .pie i{position:absolute;left:50%;top:50%;width:38%;height:38%;margin:-19% 0 0 -19%;border-radius:50%;display:grid;place-items:center}
.swt .pie i .ic{width:70%;height:70%;opacity:0;transform:scale(.3);transition:opacity .2s,transform .4s var(--spring)}
.swt.on .pie i .ic{opacity:1;transform:none}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sw-empty{padding:30px 10px;text-align:center;color:var(--c-on-surface-variant)}
.row-gap{height:14px}
.block-pad{padding:0 0 20px}
.modeline{display:flex;flex-direction:column;gap:14px}

/* custom cards */
.heroc{display:flex;align-items:center;gap:22px;padding:24px 28px}
.heroc .big{font-size:3.4em;font-weight:400;line-height:1;letter-spacing:-.02em}
.heroc small{display:block;color:var(--c-on-surface-variant);margin-top:6px}
.bar{display:flex;height:22px;border-radius:11px;overflow:hidden;gap:3px;margin:16px 0 14px}
.bar i{display:block;height:100%;min-width:6px;transition:width .6s var(--ease)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 18px}
.legend div{display:flex;align-items:center;gap:10px;font-size:.875em;color:var(--c-on-surface-variant)}
.legend i{width:12px;height:12px;border-radius:50%;flex:none}
.legend b{color:var(--c-on-surface);font-weight:500;margin-left:auto}
.chart{display:flex;align-items:flex-end;gap:14px;height:170px;padding:10px 6px 0}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;font-size:.75em;color:var(--c-on-surface-variant)}
.chart i{display:block;width:100%;max-width:56px;border-radius:14px;background:var(--c-secondary-container);min-height:6px;animation:grow .7s var(--ease) both;transform-origin:bottom}
.chart div.td i{background:var(--c-primary)}
@keyframes grow{from{transform:scaleY(0)}}
.net{display:flex;align-items:center;gap:16px;width:100%;padding:0;min-height:56px}
.net .ic.s{color:var(--c-on-surface-variant);width:26px;height:26px}
.net .nm{flex:1;min-width:0}
.net .nm b{font-weight:500;display:block}
.net .nm small{color:var(--c-on-surface-variant);font-size:.875em}
.net.cur .nm small{color:var(--c-primary)}
.empty{padding:36px 20px;text-align:center;color:var(--c-on-surface-variant)}
.device-card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 20px 24px;text-align:center}
.devimg{width:220px;aspect-ratio:16/10;border-radius:18px;background:#0a0b0d;padding:7px;box-shadow:0 0 0 2px #8a988e,0 14px 30px rgba(0,0,0,.25);position:relative}
.devimg i{display:block;width:100%;height:100%;border-radius:11px;background-size:cover;background-position:center}
.devimg::after{content:"";position:absolute;left:50%;bottom:-20px;width:140px;height:8px;margin-left:-70px;border-radius:0 0 8px 8px;background:#5d6a62}
.device-card h2{margin:10px 0 0;font-size:1.5em;font-weight:500}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{padding:8px 16px;border-radius:12px;background:var(--c-secondary-container);color:var(--c-on-secondary-container);font-size:.8125em;font-weight:500}
.fontprev{padding:28px}
.fontprev p{margin:0 0 8px}
.fontprev .big{font-size:1.75em;font-weight:400}
.appinfo{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 0 14px}
.appinfo .appi{width:72px;height:72px;display:grid;place-items:center}
.appinfo .appi .ic{width:36px;height:36px}
.appinfo b{font-size:1.4em;font-weight:500}
.appinfo small{color:var(--c-on-surface-variant)}
.btnrow{display:flex;gap:10px;justify-content:center;padding-bottom:14px;flex-wrap:wrap}
.btn{height:44px;padding:0 24px;border-radius:22px;background:var(--c-secondary-container);color:var(--c-on-secondary-container);font-weight:500;position:relative;overflow:hidden;transition:transform .3s var(--spring),border-radius .25s}
.btn:active{transform:scale(.94);border-radius:14px}
.btn.f{background:var(--c-primary);color:var(--c-on-primary)}
.btn.t{background:none;color:var(--c-primary);padding:0 14px}
.btn.t:hover{background:color-mix(in oklab,var(--c-primary) 10%,transparent)}
.btn.d{background:var(--c-error-container);color:var(--c-on-error-container)}

/* dialog / toast */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.4);display:grid;place-items:center;animation:sc .25s var(--ease)}
@keyframes sc{from{opacity:0}}
.scrim.out{opacity:0;transition:opacity .2s}
.dlg{width:min(440px,calc(100% - 48px));max-height:calc(100% - 60px);display:flex;flex-direction:column;background:var(--c-surface-container-high);border-radius:32px;padding:26px 8px 18px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);animation:dlg .5s var(--spring);color:var(--c-on-surface)}
@keyframes dlg{from{opacity:0;transform:scale(.82) translateY(30px)}}
.scrim.out .dlg{transform:scale(.94);transition:transform .2s;opacity:0}
.dlg .dh{padding:0 18px 14px;display:flex;flex-direction:column;gap:12px}
.dlg .dh .ic{color:var(--c-secondary);width:28px;height:28px;margin:0 auto}
.dlg h2{margin:0;font-size:1.5em;font-weight:400}
.dlg.ctr .dh{align-items:center;text-align:center}
.dlg .db{padding:0 18px;overflow-y:auto;color:var(--c-on-surface-variant);line-height:1.5;scrollbar-width:thin}
.dlg .da{display:flex;justify-content:flex-end;gap:6px;padding:20px 10px 0}
.dlg .opts{display:flex;flex-direction:column;margin:0 -10px;padding:0}
.opt{display:flex;align-items:center;gap:16px;padding:12px 24px;position:relative;overflow:hidden;color:var(--c-on-surface);width:100%}
.opt:hover{background:color-mix(in oklab,var(--c-on-surface) 6%,transparent)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--c-on-surface-variant);position:relative;flex:none;transition:border-color .2s}
.radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--c-primary);transform:scale(0);transition:transform .35s var(--spring)}
.opt.on .radio{border-color:var(--c-primary)}
.opt.on .radio::after{transform:scale(1)}
.tf{display:block;width:100%;margin-top:6px;height:56px;border-radius:6px;border:1px solid var(--c-outline);background:transparent;padding:0 16px;outline:0;color:var(--c-on-surface);user-select:text;transition:border-color .2s,box-shadow .2s}
.tf:focus{border-color:var(--c-primary);box-shadow:0 0 0 1px var(--c-primary)}
.tf.err{border-color:var(--c-error);box-shadow:0 0 0 1px var(--c-error);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.toast{position:absolute;left:50%;bottom:44px;z-index:70;transform:translate(-50%,30px) scale(.9);opacity:0;background:var(--c-inverse-surface);color:var(--c-inverse-on-surface);
  padding:14px 22px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.3);pointer-events:none;transition:transform .5s var(--spring),opacity .25s;font-size:.9375em;max-width:70%}
.toast.on{transform:translate(-50%,0) scale(1);opacity:1}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid color-mix(in oklab,var(--c-primary) 25%,transparent);border-top-color:var(--c-primary);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay-dim{position:absolute;inset:0;z-index:80;background:#000;pointer-events:none;opacity:0;transition:opacity .2s}
.overlay-nl{position:absolute;inset:0;z-index:81;pointer-events:none;background:rgb(255,150,40);mix-blend-mode:multiply;opacity:0;transition:opacity .6s}
.touch-dot{position:absolute;z-index:90;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 2px rgba(0,0,0,.4);pointer-events:none;animation:td .5s forwards}
@keyframes td{to{transform:scale(1.6);opacity:0}}
.fps{position:absolute;left:12px;top:42px;z-index:90;padding:4px 10px;border-radius:8px;background:rgba(0,0,0,.7);color:#7dff9a;font:600 12px monospace;pointer-events:none}

/* compact (phone / narrow) */
.compact .ui{grid-template-columns:1fr}
.compact .right{position:absolute;inset:0;background:var(--c-bg);z-index:2;transform:translateX(100%);transition:transform .45s var(--ease)}
.compact .ui[data-view=detail] .right{transform:none}
.compact .rhead{height:72px;padding:12px 16px 0}
.compact .rhead .iconbtn{display:grid}
.compact .page{padding:6px 16px 40px}
.compact .wp-top{grid-template-columns:1fr}
.compact .ni.on{}
.reduce *,.reduce *::before,.reduce *::after{animation-duration:.001s!important;transition-duration:.001s!important}
@media (prefers-reduced-motion:no-preference){}


.row.net{padding:12px 20px;min-height:64px}
/* ===== widgets (all sizes use container query units) ===== */
.wb-surface{background:var(--c-surface-container-high);color:var(--c-on-surface)}
.wb-prim{background:var(--c-primary-container);color:var(--c-on-primary-container)}
.wb-tert{background:var(--c-tertiary-container);color:var(--c-on-tertiary-container)}
.wb-sec{background:var(--c-secondary-container);color:var(--c-on-secondary-container)}
.wb-none{background:none;color:#fff;overflow:visible}
.wg .ic{width:1em;height:1em}
.wg button{color:inherit}
.wg small{color:inherit;opacity:.78}
.wg .hd{display:flex;align-items:center;justify-content:space-between;gap:3cqw}
.wg .fab{width:13cqh;height:13cqh;min-width:34px;min-height:34px;border-radius:30%;background:var(--c-primary);color:var(--c-on-primary);display:grid;place-items:center;font-size:6cqh;flex:none;transition:transform .3s var(--spring),border-radius .3s}
.wg .fab .ic{width:1.9em;height:1.9em}
.wg .fab:active{transform:scale(.88);border-radius:50%}
.wg .chip{padding:.6cqh 3cqw;border-radius:99px;background:var(--c-secondary-container);color:var(--c-on-secondary-container);font-size:4.4cqh;font-weight:500;white-space:nowrap}

/* at a glance */
.glc{position:absolute;inset:0;padding:0 1cqw;display:flex;flex-direction:column;justify-content:center;gap:6cqh;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55),0 2px 18px rgba(0,0,0,.5);cursor:pointer}
.glc .g1{font-size:36cqh;font-weight:500;letter-spacing:-.02em;line-height:1.05}
.glc .g2{display:flex;align-items:center;gap:1.1cqw;font-size:17cqh;line-height:1}
.glc .g2 i{width:.5cqh;height:.5cqh;min-width:4px;min-height:4px;border-radius:50%;background:#fff;opacity:.7;margin:0 .6cqw}
.glc .g2 .ic{font-size:21cqh}

/* pixel clocks */
.stk{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-left:3cqw;line-height:.84;font-weight:600;letter-spacing:-.045em;font-size:46cqmin;text-shadow:0 3px 20px rgba(0,0,0,.28)}
.stk .h{color:var(--c-wp-a)}
.stk .m{color:var(--c-wp-b)}
.bub{position:absolute;inset:0;display:flex;gap:3cqh}
.bub .t1{flex:1;border-radius:34cqh;background:var(--c-primary-container);color:var(--c-on-primary-container);display:flex;align-items:center;padding:0 8cqh;position:relative;overflow:hidden;transition:background .4s,color .4s}
.bub .t1 span{font-size:68cqh;font-weight:600;letter-spacing:-.045em;line-height:1}
.bub .t1 small{position:absolute;right:8cqh;top:50%;transform:translateY(-50%);text-align:right;font-size:11cqh;font-weight:500;max-width:30%;line-height:1.25}
.bub .t2{aspect-ratio:1;height:100%;border-radius:50%;background:var(--c-tertiary-container);color:var(--c-on-tertiary-container);display:grid;place-items:center;font-size:62cqh;font-weight:600;letter-spacing:-.045em;transition:background .4s,color .4s}
.cookie{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 1cqh 2cqh rgba(0,0,0,.28));overflow:visible}
.cookie .hh,.cookie .hm{transition:transform .3s}
.bold{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 2cqw;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.32)}
.bold .n{font-size:74cqh;font-weight:700;letter-spacing:-.05em;line-height:1;display:flex}
.bold .a{color:var(--c-wp-a)}.bold .b{color:var(--c-wp-b)}.bold .c{opacity:.85;margin:0 .02em}
.bold .dd{font-size:15cqh;font-weight:500;line-height:1.35;text-align:right}
.wc{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);padding:0 2cqw}
.wc .cc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5cqh;position:relative}
.wc .cc+.cc::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:1px;background:var(--c-outline-variant)}
.wc .ico{width:22cqh;height:22cqh;border-radius:50%;background:var(--c-tertiary-container);color:var(--c-on-tertiary-container);display:grid;place-items:center;font-size:12cqh}
.wc .ico.n{background:var(--c-secondary-container);color:var(--c-on-secondary-container)}
.wc b{font-size:17cqh;font-weight:500;letter-spacing:-.01em}
.wc small{font-size:10cqh}
.alm{position:absolute;inset:0;display:flex;align-items:center;gap:7cqh;padding:0 11cqh;font-size:34cqh;cursor:pointer}
.alm b{display:block;font-size:1em;font-weight:600;line-height:1.05}
.alm small{display:block;font-size:.4em;opacity:.8}

/* calendar */
.agd{position:absolute;inset:0;padding:6cqh 4cqw;display:flex;flex-direction:column;gap:3cqh}
.agd .hd b{display:block;font-size:9cqh;font-weight:500;line-height:1.1}
.agd .hd small{font-size:5.4cqh}
.agd .evs{display:flex;flex-direction:column;gap:1.6cqh;flex:1;min-height:0}
.agd .ev{flex:1;max-height:17cqh;display:flex;align-items:center;gap:3cqw;padding:0 3cqw;border-radius:5cqh;background:var(--c-surface-container-highest)}
.agd .ev i{width:1cqw;min-width:5px;height:56%;border-radius:4px}
.agd .ev b{display:block;font-size:6cqh;font-weight:500}
.agd .ev small{font-size:4.8cqh}
.agd.h2 .hd b{font-size:12cqh}.agd.h2 .hd small{font-size:7.4cqh}
.agd.h2 .ev{max-height:30cqh}.agd.h2 .ev b{font-size:9.4cqh}.agd.h2 .ev small{font-size:7.4cqh}
.mon{position:absolute;inset:0;padding:5cqh 4cqw;display:flex;flex-direction:column;gap:2cqh}
.mon .hd b{font-size:8.6cqh;font-weight:500}
.mon .hd .ic{font-size:8cqh;color:var(--c-on-surface-variant)}
.mon .gr{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;text-align:center;font-size:5.2cqh;align-items:center}
.mon .gr em{font-style:normal;color:var(--c-on-surface-variant);font-size:4.4cqh}
.mon .gr span{position:relative;display:grid;place-items:center;aspect-ratio:1;max-height:100%;margin:auto;height:100%;border-radius:50%}
.mon .gr span.td{background:var(--c-primary);color:var(--c-on-primary);font-weight:700}
.mon .gr span i{position:absolute;bottom:8%;width:.8cqh;height:.8cqh;min-width:4px;min-height:4px;border-radius:50%;background:var(--c-tertiary)}
.dte{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 9cqw}
.dte small{font-size:9cqh;font-weight:500}
.dte b{font-size:50cqh;font-weight:500;line-height:1;letter-spacing:-.04em}
.dte span{font-size:8.6cqh;opacity:.8}

/* gmail */
.inb{position:absolute;inset:0;padding:5cqh 4cqw;display:flex;flex-direction:column;gap:2.6cqh}
.inb .hd b{font-size:8.6cqh;font-weight:500;margin-right:auto}
.inb .ml{display:flex;flex-direction:column;gap:1.4cqh;flex:1;min-height:0}
.inb .mi{flex:1;max-height:17cqh;display:flex;align-items:center;gap:3cqw;padding:0 3cqw;border-radius:5cqh;background:var(--c-surface-container-highest);cursor:pointer;transition:opacity .3s}
.inb .mi.rd{opacity:.62}
.inb .mi .av{width:10cqh;height:10cqh;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:5.4cqh;flex:none}
.inb .mi .tx{flex:1;min-width:0}
.inb .mi b{display:block;font-size:5.6cqh;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inb .mi.rd b{font-weight:400}
.inb .mi small{display:block;font-size:4.8cqh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inb .mi em{font-style:normal;font-size:4.4cqh;color:var(--c-on-surface-variant)}
.inb.h2 .hd b{font-size:12cqh}.inb.h2 .chip{font-size:7cqh}
.inb.h2 .mi{max-height:32cqh}.inb.h2 .mi .av{width:17cqh;height:17cqh;font-size:8.6cqh}.inb.h2 .mi b{font-size:8.6cqh}.inb.h2 .mi small{font-size:7.2cqh}.inb.h2 .mi em{font-size:6.6cqh}
.unr{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 10cqw;gap:1cqh}
.unr .ic{font-size:16cqh;margin-bottom:4cqh}
.unr b{font-size:44cqh;font-weight:500;line-height:1;letter-spacing:-.03em}
.unr small{font-size:9cqh}

/* maps */
.cmt{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1.15fr}
.cmt .tx{padding:8cqh 6cqw;display:flex;flex-direction:column;justify-content:center;gap:3cqh}
.cmt small{font-size:8cqh;display:flex;align-items:center;gap:2cqw;opacity:.9}
.cmt b{font-size:26cqh;font-weight:500;line-height:1;letter-spacing:-.02em}
.cmt span{font-size:7.6cqh;display:flex;align-items:center;gap:1.4cqw;color:var(--c-on-surface-variant)}
.cmt span i{width:3cqh;height:3cqh;border-radius:50%;background:#1e8e3e}
.cmt .btn2{margin-top:2cqh;align-self:flex-start;height:17cqh;padding:0 5cqw;border-radius:99px;background:var(--c-primary);color:var(--c-on-primary);font-size:7.4cqh;font-weight:500;display:flex;align-items:center;gap:1.6cqw}
.cmt .mp{margin:3cqh 3cqh 3cqh 0;border-radius:24cqh/20cqh;overflow:hidden}
.cmt .mp svg{width:100%;height:100%;display:block}
.exp{position:absolute;inset:0;display:flex;align-items:center;gap:2cqw;padding:0 3cqw}
.exp button{flex:1;height:60%;border-radius:99px;background:var(--c-surface-container-highest);display:flex;align-items:center;justify-content:center;gap:1.6cqw;font-size:22cqh;transition:transform .3s var(--spring),background .2s}
.exp button span{font-size:.62em;font-weight:500}
.exp button:hover{background:var(--c-secondary-container)}
.exp button:active{transform:scale(.94)}
.exp .ic{color:var(--c-primary)}
.hmw{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 10cqw;gap:1.6cqh}
.hmw .ic{font-size:16cqh;margin-bottom:4cqh}
.hmw b{font-size:15cqh;font-weight:500}
.hmw small{font-size:18cqh;font-weight:500;opacity:1;line-height:1}
.hmw span{font-size:9cqh;display:flex;align-items:center;gap:2cqw}
.hmw span i{width:4cqh;height:4cqh;border-radius:50%;background:#1e8e3e}

/* photos */
.pho{position:absolute;inset:0;display:flex;gap:2cqh;background:var(--c-surface-container-high)}
.pho .im{flex:1;background-size:cover;background-position:center;transition:background-image .3s}
.pho::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.55));pointer-events:none}
.pho .cap{position:absolute;left:6cqw;bottom:7cqh;color:#fff;z-index:2;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.pho .cap small{display:flex;align-items:center;gap:1.4cqw;font-size:8cqh;opacity:.9}
.pho .cap b{font-size:12cqh;font-weight:500}
.pho{cursor:pointer}

/* music */
.ply{position:absolute;inset:0;display:flex;gap:5cqh;padding:7cqh}
.ply .art{height:100%;aspect-ratio:1;border-radius:20cqh;display:grid;place-items:center;color:#fff;font-size:30cqh;flex:none;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.ply .tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1.6cqh}
.ply small{font-size:7.6cqh}
.ply b{font-size:14cqh;font-weight:500;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ply span{font-size:9.4cqh;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ply .pr,.mini .pr{height:2.6cqh;min-height:4px;border-radius:99px;background:color-mix(in oklab,currentColor 18%,transparent);margin:4cqh 0 1cqh;overflow:hidden}
.ply .pr i,.mini .pr i{display:block;height:100%;background:var(--c-primary);border-radius:99px;transition:width 1s linear}
.ply .ctl{display:flex;align-items:center;gap:1.4cqw;font-size:12cqh}
.ply .ctl button{width:2.1em;height:2.1em;border-radius:50%;display:grid;place-items:center;transition:transform .3s var(--spring),border-radius .3s}
.ply .ctl button.pp{background:var(--c-primary);color:var(--c-on-primary);width:2.6em;border-radius:36%}
.ply .ctl button:active{transform:scale(.88);border-radius:50%}
.ply .ctl em{margin-left:auto;font-style:normal;font-size:.62em;opacity:.8}
.mini{position:absolute;inset:0;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:8cqh}
.mini .inf b{display:block;font-size:11cqh;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.mini .inf small{font-size:8cqh}
.mini .pp{position:absolute;right:8cqh;top:8cqh;width:22cqh;height:22cqh;border-radius:36%;background:rgba(255,255,255,.9);color:#222;display:grid;place-items:center;font-size:12cqh;transition:transform .3s var(--spring),border-radius .3s}
.mini .pp:active{transform:scale(.88);border-radius:50%}
.mini .pr{background:rgba(255,255,255,.3)}.mini .pr i{background:#fff}

/* keep */
.kn{position:absolute;inset:0;padding:5cqh;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:3cqh}
.kn:not(.wide){grid-template-columns:1fr 1fr;grid-auto-rows:1fr}
.kn .nt{border-radius:7cqh;padding:5cqh 5cqw;display:flex;flex-direction:column;gap:2cqh;overflow:hidden}
.kn .nt b{font-size:8cqh;font-weight:600}
.kn .nt span{font-size:6.6cqh;opacity:.85;line-height:1.35}
.kn:not(.wide) .nt b{font-size:9.4cqh}.kn:not(.wide) .nt span{font-size:7.6cqh;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.kn:not(.wide) .fab{width:13cqh;height:13cqh}.kn .nt span{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.kn .fab{position:absolute;right:5cqh;bottom:5cqh;width:16cqh;height:16cqh;box-shadow:0 3px 12px rgba(0,0,0,.3)}
.kadd{position:absolute;inset:0;display:flex;align-items:center;gap:4cqw;padding:0 5cqw;font-size:26cqh;cursor:pointer}
.kadd span{flex:1;font-size:.72em;color:var(--c-on-surface-variant)}
.kadd .ic{color:var(--c-on-surface-variant)}

/* weather */
.wxn{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 10cqw;gap:1cqh}
.wxn .ic{font-size:26cqh;color:var(--c-tertiary);margin-bottom:2cqh}
.wxn b{font-size:34cqh;font-weight:400;line-height:1;letter-spacing:-.03em}
.wxn small{font-size:8.6cqh}
.wxf{position:absolute;inset:0;display:grid;grid-template-columns:.8fr 1.6fr;padding:6cqh 3cqw}
.wxf .cur{display:flex;flex-direction:column;justify-content:center;padding-left:3cqw;gap:1.5cqh}
.wxf .cur b{font-size:34cqh;font-weight:400;line-height:1;letter-spacing:-.03em}
.wxf .cur small{font-size:9cqh}.wxf .cur span{font-size:8cqh;opacity:.8}
.wxf .hr{display:grid;grid-template-columns:repeat(6,1fr);align-items:center;text-align:center;font-size:14cqh;border-radius:8cqh;background:color-mix(in oklab,var(--c-on-primary-container) 8%,transparent)}
.wxf .hr div{display:flex;flex-direction:column;align-items:center;gap:5cqh}
.wxf .hr small{font-size:.5em}.wxf .hr b{font-size:.62em;font-weight:500}
.wxf .hr .ic{color:var(--c-tertiary)}
.wxd{position:absolute;inset:0;padding:6cqh 4cqw;display:flex;flex-direction:column;gap:3cqh}
.wxd .hd b{font-size:11cqh;font-weight:500}.wxd .hd small{font-size:8cqh}
.wxd .dy{flex:1;display:grid;grid-template-columns:repeat(5,1fr);text-align:center;font-size:15cqh;align-items:center}
.wxd .dy div{display:flex;flex-direction:column;align-items:center;gap:3cqh}
.wxd .dy small{font-size:.5em}.wxd .dy b{font-size:.6em;font-weight:500}.wxd .dy em{font-style:normal;font-size:.52em;color:var(--c-on-surface-variant)}
.wxd .dy .ic{color:var(--c-primary)}

/* drive / home / tasks / search / contacts / files */

  --c-surface-container:color-mix(in oklab,var(--c-g-cont) calc(var(--lg-tint)*1%),transparent);

}

.glass :is(.row,.card,.searchbar,.seg,.menu,.dlg,.pk,.drawer,.sugg,.dsearch,.nsb,.afab,.k,.pbtn,.mc,.chip2,.al,.ae,.cm,.ni2,.ne,.tkr,.tadd input,.whero,.omni,.tay,.qt,.pk-s,.pkc,.opt):not(.hidden){

  background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(var(--lg-blur)) saturate(var(--lg-sat));backdrop-filter:blur(var(--lg-blur)) saturate(var(--lg-sat));box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.22),0 8px 24px rgba(0,0,0,.35);transition:transform .3s var(--spring)}

/* ===== Android 16 flavour (Material 3 Expressive) ===== */

/* popup menus: a stack of rounded containers with filled icons and a bouncy entrance */

/* ===== 补帧：动画期间的轻量玻璃 ===== */
/* 关掉 backdrop-filter，同时把半透明底色补足，避免文字失去对比度。
   .row / .card 等本身对 background 有 300ms 过渡，所以切换是渐进的。 */
.perf-lite :is(.row,.card,.searchbar,.seg,.menu,.dlg,.pk,.sugg,.dsearch,.nsb,.afab,.k,.pbtn,.mc,.chip2,.al,.ae,.cm,.ni2,.tkr,.tadd input,.whero,.omni,.tay,.qt,.pk-s,.pkc,.opt,.wg,.appi):not(.hidden),
.perf-lite :is(.ccb,.ccscrim,.tvh,.tvclear,.nav .jelly){
  -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
}
/* 表面改为不透明，观感从"毛玻璃"变成"实色"，但仍然保留高光与描边 */
.perf-lite{--c-surface-container-lowest:var(--c-g-lowest);--c-surface-container-low:var(--c-g-low);
  --c-surface-container:var(--c-g-cont);--c-surface-container-high:var(--c-g-high);--c-surface-container-highest:var(--c-g-highest);
  --c-card:var(--c-g-card)}
.perf-lite .win:not(.opaquewin)::before{filter:blur(46px) saturate(1.5)}
/* 折射滤镜（Chromium 的 SVG 位移滤镜）非常贵，一并关掉 */
.perf-lite.lg-r :is(.ccb,.menu,.dlg,.pk,.drawer,.dsearch,.tvh,.tvclear){-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
/* 阴影与描边保留，玻璃的立体感还在 */
.perf-lite :is(.row,.card,.searchbar,.seg,.wg):not(.hidden){box-shadow:var(--lgbox)}

/* 参数面板里的帧时间表 */
.perfgauge{margin-top:14px}

.perfgauge small{display:block;margin-top:6px;font-size:.75em;opacity:.62;line-height:1.4}
#perfseg{margin-top:10px}

  const el = e.target.closest && e.target.closest('.rip'); if (!el || MOTION.reduce) return;
  const r = el.getBoundingClientRect(), sc = (r.width / el.offsetWidth) || 1, w = el.offsetWidth, h = el.offsetHeight;
  const x = (e.clientX - r.left) / sc, y = (e.clientY - r.top) / sc, d = Math.hypot(Math.max(x, w - x), Math.max(y, h - y)) * 2;
  const s = document.createElement('span'); s.className = 'rp'; s.style.cssText = `width:${d}px;height:${d}px;left:${x - d / 2}px;top:${y - d / 2}px`;
  el.append(s); setTimeout(() => s.remove(), 750);
});

/* ---- weather (real data from Open-Meteo, cached) ---- */
const Weather = Object.assign({ city: '北京', lat: 39.9042, lon: 116.4074, now: 24, feel: 25, hum: 42, wind: 9, code: 0, day: 1, hi: 27, lo: 18, updated: 0, loading: false, err: '', hours: [], days: [] }, jget('ms-wx', {}));
function wxInfo(code, day = 1) {
  if (code === 0) return day ? ['wb_sunny', '晴'] : ['bedtime', '晴夜'];
  if (code <= 2) return day ? ['partly_cloudy_day', '多云'] : ['bedtime', '多云'];
  if (code === 3) return ['cloud', '阴'];
  if (code <= 48) return ['air', '雾'];
  if (code <= 67 || (code >= 80 && code <= 82)) return ['water_drop', '雨'];
  if (code <= 77 || code >= 85 && code <= 86) return ['ac_unit', '雪'];
  return ['bolt', '雷暴'];
}
if (!Weather.hours.length) { Weather.hours = [['现在', 0, 24], ['15时', 0, 26], ['16时', 1, 25], ['17时', 1, 23], ['18时', 3, 21], ['19时', 3, 20]]; Weather.days = [['今天', 0, 27, 18], ['明天', 1, 25, 17], ['周六', 61, 21, 15], ['周日', 2, 23, 16], ['周一', 0, 26, 17], ['周二', 3, 24, 16], ['周三', 1, 25, 17]]; }
async function loadWeather(force) {
  if (Weather.loading || (!force && Date.now() - Weather.updated < 20 * 60e3)) return;
  Weather.loading = true; Weather.err = '';
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${Weather.lat}&longitude=${Weather.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7`;
    const r = await fetch(u); if (!r.ok) throw new Error('http ' + r.status); const j = await r.json(), c = j.current;
    Weather.now = Math.round(c.temperature_2m); Weather.feel = Math.round(c.apparent_temperature); Weather.hum = c.relative_humidity_2m; Weather.wind = Math.round(c.wind_speed_10m);
    Weather.code = c.weather_code; Weather.day = c.is_day;
    const nowH = new Date(c.time).getTime(); const hs = [];

function nowParts(tz) {
  const p = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: tz || get('tz') }).formatToParts(new Date());
  const g = t => +p.find(x => x.type === t).value % (t === 'hour' ? 24 : 60);
  return { h: g('hour'), m: g('minute'), s: g('second') };
}
const disp12 = h => get('tz24') ? pad2(h) : String(h % 12 || 12);
/* soft 12-lobe cookie: round lobes (circle arcs), then the cusps between lobes are smoothed out */
const cookiePath = (() => {
  const N = 12, c = 34.6, rho = 13.4, S = 360, r = new Array(S);
  for (let k = 0; k < S; k++) {
    const th = k / S * 2 * Math.PI; let best = 0;
    for (let i = 0; i < N; i++) { let d = th - i * 2 * Math.PI / N; d = Math.atan2(Math.sin(d), Math.cos(d)); const sn = c * Math.sin(d); if (Math.abs(sn) < rho) best = Math.max(best, c * Math.cos(d) + Math.sqrt(rho * rho - sn * sn)); }
    r[k] = best;
  }
  let a = r; for (let pass = 0; pass < 1; pass++) { const o = new Array(S); for (let k = 0; k < S; k++) { let t = 0, w = 0; for (let j = -3; j <= 3; j++) { const q = 4 - Math.abs(j); t += a[(k + j + S) % S] * q; w += q; } o[k] = t / w; } a = o; }
  let d = ''; for (let k = 0; k <= S; k++) { const th = (k % S) / S * 2 * Math.PI, rr = a[k % S] + .9; d += (k ? 'L' : 'M') + (50 + rr * Math.sin(th)).toFixed(2) + ' ' + (50 - rr * Math.cos(th)).toFixed(2); }
  return d + 'Z';
})();

/* ============ 补帧：让动画跑满刷新率 ============
   浏览器的 rAF 跟着屏幕刷新率走，60Hz 下 16.7ms 就是满帧，浏览器无法插值出更多帧。
   真正掉帧的原因不是"帧率不够"，而是每帧的光栅化开销：
   屏幕上任何带 backdrop-filter 的元素，只要它背后的东西变了（canvas 重绘、
   图层重建、弹簧位移），浏览器就必须重新快照并重新做一次高斯模糊。
   本演示里这样的元素有二十多个，于是每帧重复二十多次模糊。

   做法：动画进行中给 #device 加 .perf-lite，暂时摘掉背景模糊；所有动画停止
   140ms 后立刻恢复。表面底色本身走 background 过渡（.row 已有 .3s 过渡），
   所以"变实"的过程是平滑的，不会突然闪一下。静置时观感与原来完全一致。 */

const PERF_MODES = [
  ['auto', '自动', '动画时临时降低玻璃模糊，静止后立刻恢复'],
  ['max', '始终流畅', '始终关闭背景模糊，帧率最高、玻璃质感最弱'],
  ['off', '关闭', '始终保持完整玻璃特效'],
];
const noop = () => {};
const Perf = {
  mode: 'auto', n: 0, lite: false, guard: 0,
  frames: [], raf: 0, on: false, hud: null, hudRaf: 0, last: 0,
};
const perfMode = () => (PERF_MODES.some(m => m[0] === get('frameSync')) ? get('frameSync') : 'auto');

Perf.setLite = function (on) {
  if (on === Perf.lite) return;
  Perf.lite = on;
  const dev = $('#device'); if (!dev) return;
  dev.classList.toggle('perf-lite', on);
  if (Perf.hud) Perf.hud();
};

/* 动画开始：登记一个进行中的动画，返回结束函数 */
Perf.hold = function () {
  if (perfMode() === 'off') return noop;
  Perf.n++;
  clearTimeout(Perf.guard);
  Perf.setLite(true);
  let done = false;
  return function release() {
    if (done) return;
    done = true;
    Perf.n = Math.max(0, Perf.n - 1);
    Perf.last = performance.now();
    if (!Perf.n) {
      clearTimeout(Perf.guard);
      /* 兜底：即使漏掉一次 release，140ms 后也会自动恢复玻璃 */
      Perf.guard = setTimeout(() => { Perf.n = 0; if (perfMode() !== 'max') Perf.setLite(false); }, 140);
    }
  };
};

/* Web Animations：动画期间摘掉模糊。
   finished 在动画被取消、或元素当时没被渲染时可能永远不结算，
   所以额外挂一个定时器兜底，保证补帧计数一定会归还。 */
Perf.animate = function (el, frames, opts) {
  const rel = Perf.hold();
  let done = false;
  const fin = () => { if (done) return; done = true; clearTimeout(t); rel(); };
  const t = setTimeout(fin, (opts && opts.duration || 0) + 400);
  const a = el.animate(frames, opts);
  a.finished.then(fin, fin);
  return a;
};

/* 切换模式 */
Perf.setMode = function (m) {
  set('frameSync', m);
  clearTimeout(Perf.guard);
  Perf.n = 0;
  Perf.setLite(m === 'max');
  const row = PERF_MODES.find(x => x[0] === m);
  toast('补帧：' + (row ? row[1] : m));
  if (Perf.hud) Perf.hud();
};

/* ---------- 帧时间统计（给参数面板用） ---------- */
Perf.tick = function (t) {

};

  const d = [];
  for (let i = 1; i < f.length; i++) d.push(f[i] - f[i - 1]);
  d.sort((a, b) => a - b);
  const q = p => d[Math.floor(d.length * p)];
  return { med: q(.5), p90: q(.9), max: d[d.length - 1], fps: Math.round(1000 / q(.5)), dropped: d.filter(x => x > 22).length, total: d.length };
};

/* 每秒刷新面板读数 */
Perf.startHud = function () {

  const url = c.toDataURL('image/jpeg', .8); Photos.add(url); refreshWidgets(); const th = $('.cthumb', el); th.style.backgroundImage = `url(${url})`; th.animate([{ transform: 'scale(.4)' }, { transform: 'scale(1)' }], { duration: 450, easing: 'cubic-bezier(.34,1.56,.64,1)' });
  const f = $('.cflash', el); f.animate([{ opacity: .85 }, { opacity: 0 }], { duration: 350 }); beep(50, 1500); toast('已保存到相册');
}

/* generic slider for panels outside the settings renderer */
function bindSl(sl, min, max, step, read, write) {
  const upd = e => { const b = sl.getBoundingClientRect(), p = clamp((e.clientX - b.left) / b.width, 0, 1); let v = Math.round((min + p * (max - min)) / step) * step; v = clamp(v, min, max); if (v !== read()) write(v); };
  sl.addEventListener('pointerdown', e => { sl.setPointerCapture(e.pointerId); sl.classList.add('drag'); upd(e); sl.onpointermove = upd; sl.onpointerup = sl.onpointercancel = () => { sl.classList.remove('drag'); sl.onpointermove = null; }; });
  sl.addEventListener('keydown', e => { if (e.key.startsWith('Arrow')) { e.preventDefault(); write(clamp(read() + (/Left|Down/.test(e.key) ? -step : step), min, max)); } });
}
